<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<title>Hunter System</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><div class="grid"></div><div class="scan"></div></div>
<header class="top">
  <div class="brand"><span class="sys">SYSTEM</span><span id="syncState" class="sync">offline</span></div>
  <button id="syncBtn" class="icon-btn" aria-label="Sync">⟳</button>
</header>
<main id="app">
  <section id="v-status" class="view"></section>
  <section id="v-quests" class="view" hidden></section>
  <section id="v-gates" class="view" hidden></section>
  <section id="v-log" class="view" hidden></section>
  <section id="v-codex" class="view" hidden></section>
</main>
<nav class="tabs">
  <button data-v="status" class="on"><i>◈</i>Status</button>
  <button data-v="quests"><i>✦</i>Quests</button>
  <button data-v="gates"><i>⬡</i>Gates</button>
  <button data-v="log"><i>☰</i>Log</button>
  <button data-v="codex"><i>❖</i>Codex</button>
</nav>
<div id="toasts"></div>
<div id="overlay" hidden></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
